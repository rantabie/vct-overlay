<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VCT Match Winner</title>
    <link rel="stylesheet" href="style.css?v=20260730a">
  </head>
  <body>
    <main class="workspace">
      <section class="overlay-stage" aria-label="VCT winner overlay">
        <img class="winner-background" src="../../assets/vct/match/winner.png" alt="">

        <section class="winner-hud" aria-label="Winner information">
          <div class="winner-name" id="winnerName">Player Winner</div>
          <div class="winner-details">
            <span id="stageName">Round of 32</span>
            <span id="scoreLine">0 - 0</span>
          </div>
        </section>

        <div class="connection-chip" id="connectionChip">tosu offline</div>
        <pre class="diagnostics-panel" id="diagnosticsPanel" aria-hidden="true"></pre>
      </section>

      <aside class="control-panel">
        <h1>VCT Winner</h1>
        <div class="control-status" id="controlStatus"></div>
        <button type="button" id="reloadDataButton">Reload JSON</button>
        <label class="file-button" for="jsonFileInput">Load Match JSON</label>
        <input id="jsonFileInput" type="file" accept="application/json,.json">
        <button type="button" id="clearStorageButton">Clear Saved JSON</button>
        <p>
          Use <code>?winner=left</code> or <code>?winner=right</code> to force
          the displayed winner.
        </p>
      </aside>
    </main>

    <script src="index.js?v=20260730a"></script>
  </body>
</html>
