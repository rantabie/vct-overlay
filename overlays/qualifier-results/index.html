<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VCT Qualifier Results</title>
    <link rel="stylesheet" href="style.css?v=country-mod-seeds-1">
  </head>
  <body>
    <main class="workspace">
      <section class="overlay-stage" aria-label="VCT qualifier results overlay">
        <img class="qualifier-frame" src="../../assets/vct/overlay/qualifier-results.png" alt="">

        <section class="player-card" aria-label="Player seed details">
          <div class="avatar-wrap">
            <img id="playerAvatar" class="avatar" src="" alt="">
            <div class="avatar-fallback" id="avatarFallback">VCT</div>
          </div>

          <div class="player-name" id="playerName">Player Name</div>
          <div class="player-country" id="playerCountry">Vietnam</div>

          <dl class="seed-summary">
            <div>
              <dt>Rank:</dt>
              <dd id="globalRank">#---</dd>
            </div>
            <div>
              <dt>Seed:</dt>
              <dd id="qualifierSeed">#---</dd>
            </div>
            <div>
              <dt>%Max Sum:</dt>
              <dd id="percentMaxSum">---</dd>
            </div>
            <div>
              <dt>Avg. Score:</dt>
              <dd id="averageScore">---</dd>
            </div>
          </dl>
        </section>

        <section class="bracket-list" id="bracketList" aria-label="Qualifier map results"></section>

        <div class="empty-state" id="emptyState">Add players and qualifier maps in data/seeding.json</div>
      </section>

      <aside class="control-panel">
        <h1>Qualifier Results</h1>
        <div class="control-status" id="controlStatus"></div>
        <button type="button" id="reloadDataButton">Reload JSON</button>
        <label class="file-button" for="jsonFileInput">Load JSON File</label>
        <input id="jsonFileInput" type="file" accept="application/json,.json">
        <div class="control-row">
          <button type="button" id="prevPlayerButton">Prev Player</button>
          <button type="button" id="nextPlayerButton">Next Player</button>
        </div>
        <select id="playerSelect" aria-label="Choose player"></select>
        <button type="button" id="clearStorageButton">Clear Saved JSON</button>
        <p>
          OBS should crop to 1920x1080. This panel starts outside that frame.
        </p>
      </aside>
    </main>

    <script src="index.js?v=country-mod-seeds-1"></script>
  </body>
</html>
