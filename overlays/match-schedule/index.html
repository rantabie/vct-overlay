<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VCT Match Schedule</title>
    <link rel="stylesheet" href="style.css?v=20260730g">
  </head>
  <body>
    <main class="workspace">
      <section class="overlay-stage" aria-label="VCT match schedule overlay">
        <img class="schedule-background" src="../../assets/vct/match/schedule.png" alt="">

        <section class="schedule-hud" aria-label="Schedule information">
          <div class="match-list recent-list" id="recentList"></div>
          <div class="match-list upcoming-list" id="upcomingList"></div>
          <div class="next-match" id="nextMatch"></div>
        </section>

        <div class="connection-chip" id="connectionChip">schedule loading</div>
        <pre class="diagnostics-panel" id="diagnosticsPanel" aria-hidden="true"></pre>
      </section>

      <aside class="control-panel">
        <h1>VCT Schedule</h1>
        <div class="control-status" id="controlStatus"></div>
        <button type="button" id="reloadDataButton">Reload JSON</button>
        <label class="file-button" for="jsonFileInput">Load Match JSON</label>
        <input id="jsonFileInput" type="file" accept="application/json,.json">
        <button type="button" id="clearStorageButton">Clear Saved JSON</button>
        <p>
          Use <code>?layer=background</code> and <code>?layer=hud</code> for
          separated OBS browser sources.
        </p>
      </aside>
    </main>

    <script src="index.js?v=20260730h"></script>
  </body>
</html>
